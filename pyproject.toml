[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mikit-learn"
version = "1.0.3"
description = "Multi-instance machine learning in Python"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Dmitry Zankov", email = "dvzankov@gmail.com" }
]

dependencies = [
    "scikit-learn==1.9.0",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "lightning==2.6.5",
]

[tool.setuptools.packages.find]
where = ["."]
